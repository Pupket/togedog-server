<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
<h1>Chat Application</h1>
<div>
    <h2>Create Chat Room</h2>
    <label for="token">JWT Token:</label>
    <input type="text" id="token" placeholder="Enter JWT Token" />

    <label for="receiverId">Receiver ID:</label>
    <input type="text" id="receiverId" placeholder="Receiver ID" />

    <button id="createRoomBtn">Create and Connect</button>
    <p id="roomIdDisplay"></p>
</div>
<div id="chatSection" style="display:none;">
    <h2>Chat Room: <span id="roomId"></span></h2>
    <textarea id="message" placeholder="Type a message..."></textarea>

    <!-- 이미지 파일 선택 -->
    <label for="imageInput">Attach Image:</label>
    <input type="file" id="imageInput" accept="image/*" />

    <button id="sendMessageBtn">Send</button>
    <div id="chatHistory"></div>
</div>

<script>
    let stompClient = null;
    let roomId = null;

    // 연결 및 구독 함수
    function connect() {
        const socket = new SockJS('http://localhost:8080/ws'); // 서버 WebSocket 엔드포인트
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function(frame) {
            console.log('Connected:', frame);
            stompClient.subscribe('/sub/chat/room/' + roomId, function(message) {
                const msg = JSON.parse(message.body);
                console.log("Message received:", msg);
                document.getElementById('chatHistory').innerHTML += `<p>[${msg.lastTime}] ${msg.userId}: ${msg.content}</p>`;

                if (msg.image) {
                    const imgElement = document.createElement('img');

                    if (msg.image.startsWith('http://') || msg.image.startsWith('https://')) {
                        // URL일 경우, 그대로 사용
                        imgElement.src = msg.image;
                    } else if (msg.image.startsWith('data:image/')) {
                        // base64 인코딩된 이미지일 경우
                        imgElement.src = msg.image;
                    } else {
                        // 예외 처리 (알 수 없는 형식일 경우)
                        console.error('Unknown image format:', msg.image);
                        return;
                    }

                    imgElement.style.maxWidth = '200px';
                    document.getElementById('chatHistory').appendChild(imgElement);
                }
            });
        });
    }

    // 방 생성과 구독을 동시에 수행
    document.getElementById('createRoomBtn').onclick = function() {
        const receiverId = document.getElementById('receiverId').value;
        const token = document.getElementById('token').value; // 사용자 입력 토큰

        if (!token) {
            alert('Please enter a valid JWT token.');
            return;
        }

        fetch('/api/v1/chat/get-or-create?receiver=' + receiverId, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token // 헤더에 입력된 토큰 추가
            }
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                roomId = data;
                document.getElementById('roomIdDisplay').innerText = 'Room ID: ' + roomId;
                document.getElementById('roomId').innerText = roomId;
                document.getElementById('chatSection').style.display = 'block';

                // 방이 생성되면 바로 연결하고 구독
                connect(roomId);
            })
            .catch(error => {
                console.error('There was a problem with the fetch operation:', error);
            });
    };

    // 이미지 파일을 base64로 변환하는 함수
    function convertImageToBase64(file, callback) {
        const reader = new FileReader();
        reader.onloadend = function() {
            callback(reader.result.split(',')[1]); // base64 인코딩된 문자열 반환
        };
        reader.readAsDataURL(file); // 파일을 base64로 읽기
    }

    // 메시지 전송
    document.getElementById('sendMessageBtn').onclick = function() {
        const messageContent = document.getElementById('message').value;
        const fileInput = document.getElementById('imageInput');
        let imageBase64 = "";

        if (fileInput.files.length > 0) {
            // 이미지 파일이 첨부된 경우
            const file = fileInput.files[0];
            convertImageToBase64(file, function(base64Image) {
                imageBase64 = base64Image; // base64 인코딩된 이미지
                sendMessage(messageContent, imageBase64);
            });
        } else {
            // 이미지가 없으면 메시지만 전송
            sendMessage(messageContent, imageBase64);
        }
    };

    // 메시지 전송 함수
    function sendMessage(content, imageBase64) {
        const message = {
            roomId: roomId,
            userId: 1, // 실제 사용자 ID로 교체
            content: content,
            lastTime: new Date().toISOString(),
            image: imageBase64 // 이미지 데이터 추가
        };

        stompClient.send("/pub/chat", {}, JSON.stringify(message));
        console.log("Message sent:", message);

        // 메시지 입력 필드 비우기
        document.getElementById('message').value = '';
        document.getElementById('imageInput').value = ''; // 파일 입력 필드 초기화
    }
</script>
</body>
</html>
